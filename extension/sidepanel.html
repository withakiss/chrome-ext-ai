<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-region" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-lines" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
  <symbol id="i-wrap" viewBox="0 0 24 24"><path d="M3 6h18M3 12h15a3 3 0 0 1 0 6h-4M3 18h7M16 16l-2 2 2 2"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
</svg>
<div id="app">
  <header id="top">
    <span class="logo"><svg><use href="#i-spark"/></svg></span>
    <span class="selwrap"><select id="sessionSelect" title="채팅 선택"></select></span>
    <button id="newChat" class="ib glass" title="새 채팅" aria-label="새 채팅"><svg><use href="#i-plus"/></svg></button>
    <button id="deleteChat" class="ib glass" title="이 채팅 삭제" aria-label="이 채팅 삭제"><svg><use href="#i-trash"/></svg></button>
    <button id="settingsBtn" class="ib glass" title="설정" aria-label="설정"><svg><use href="#i-gear"/></svg></button>
  </header>
  <div id="statusBar">
    <div class="badges">
      <span id="bModel" class="badge"></span>
      <div id="projWrap"><button id="bProject" class="badge btn" type="button" aria-haspopup="menu"><svg><use href="#i-folder"/></svg><span></span></button><div id="projMenu" class="menu" hidden></div></div>
      <span id="bNet" class="badge net" title="모델 서버 연결 상태"><i></i><span>연결 확인 전</span></span>
    </div>
    <div id="modes" role="tablist" aria-label="모드">
      <button type="button" role="tab" data-mode="chat">일반 대화</button><button type="button" role="tab" data-mode="code">코딩 보조</button><button type="button" role="tab" data-mode="screen">화면 분석</button>
    </div>
  </div>
  <div id="sheet" hidden><div class="sheet-head"><button id="sheetClose" class="ib" type="button" aria-label="닫기"><svg><use href="#i-x"/></svg></button><span id="sheetTitle"></span></div><div id="sheetBody"></div></div>
  <main id="messages"></main>
  <button id="toBottom" type="button" aria-label="맨 아래로" title="맨 아래로" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
  <section id="empty">
    <div class="hero">
      <span class="big"><svg><use href="#i-spark"/></svg></span>
      <h1>무엇을 도와드릴까요?</h1>
      <p>페이지를 읽고 조작하고, 프로젝트 소스를 분석하고,<br>고른 화면은 이미지까지 읽어요.</p>
    </div>
    <h2>이런 것도 돼요</h2>
    <div class="card">
      <button class="ex" data-mode="code" data-q="이 프로젝트 구조를 분석해서 핵심 흐름을 구조도로 그리고, 진입점과 주요 파일을 근거와 함께 알려줘"><span class="ic"><svg><use href="#i-code"/></svg></span><span class="tx"><b>소스 분석</b>프로젝트 구조와 핵심 흐름을 구조도로</span></button>
      <button class="ex" data-mode="screen" data-q="이 화면의 입력 폼을 정상값·빈값·경계값 테스트 케이스로 각각 입력하고 제출해서, 케이스별 결과를 표로 정리해줘"><span class="ic"><svg><use href="#i-check"/></svg></span><span class="tx"><b>테스트 자동화</b>폼을 케이스별로 입력·제출하고 결과 표로</span></button>
      <button class="ex" data-mode="screen" data-q="이 페이지의 콘솔 오류와 실패한 네트워크 요청을 찾아서 원인을 분석하고, 관련 소스 위치까지 짚어줘"><span class="ic"><svg><use href="#i-search"/></svg></span><span class="tx"><b>오류 추적</b>콘솔 오류·실패 요청에서 원인 코드까지</span></button>
      <button class="ex" data-mode="screen" data-region="1" data-q="선택한 영역을 이미지까지 보고 레이아웃·정렬·문구 문제를 찾아서, 고칠 CSS를 제안해줘"><span class="ic"><svg><use href="#i-region"/></svg></span><span class="tx"><b>화면 선택 + 이미지 인식</b>고른 영역의 UI 버그와 고칠 CSS 제안</span></button>
    </div>
  </section>
  <footer>
    <div id="tabChip"></div>
    <div id="regionChip" hidden><span id="regionLabel"></span><button id="regionClear" class="x" title="선택 해제" aria-label="선택 해제"><svg><use href="#i-x"/></svg></button></div>
    <div id="attachChips"></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요"></textarea>
      <div id="bar">
        <div id="plusWrap"><button id="plusBtn" class="ib soft" title="첨부" aria-label="첨부"><svg><use href="#i-plus"/></svg></button><div id="plusMenu" class="menu" hidden><button id="addFiles">파일 또는 사진 추가</button><button id="addFolder">폴더 추가</button><div class="hint">클립보드 이미지는 입력창에 ⌘V, 드래그 앤 드롭도 됩니다</div></div></div>
        <input id="fileInput" type="file" multiple hidden>
        <button id="selectRegion" class="ib soft" title="화면에서 선택" aria-label="화면에서 선택"><svg><use href="#i-region"/></svg></button>
        <span class="selwrap soft"><select id="modelSelect" title="모델 선택"></select></span>
        <button id="send" class="ib primary" title="보내기" aria-label="보내기"><svg><use href="#i-send"/></svg></button>
        <button id="stop" class="ib primary" title="중지" aria-label="중지" hidden><svg><use href="#i-stop"/></svg></button>
      </div>
    </div>
    <div class="note">AI는 실수를 할 수 있습니다.</div>
  </footer>
  <section id="settings" hidden></section>
</div>
<iframe id="repl" src="repl.html" sandbox="allow-scripts" hidden></iframe>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
